name: Feature request
description: Propose a focused improvement to the public workflow package.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the concrete workflow gap or user outcome.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest complete change that would solve it.
    validations:
      required: true
  - type: textarea
    id: routing
    attributes:
      label: Routing and compatibility impact
      description: Note affected skills, triggers, manifests, PowerShell versions, or installation behavior.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
